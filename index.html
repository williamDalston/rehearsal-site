<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1520">
<title>The House That AI Built — rehearsal</title>
<style>
:root{
  --bg:#0d1520; --panel:#141e2b; --panel2:#1b2836; --line:#2a3a4d;
  --ink:#e8eef4; --dim:#93a5b8; --faint:#64788d;
  --navy:#4b9fd8; --gold:#f0b429; --red:#f2647a; --green:#3ec98a;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --recbar-h:64px;
  --header-pad:9px 16px;
  --main-gap:14px;
  --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%, rgba(75,159,216,.12), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(240,180,41,.06), transparent 50%),
    var(--bg);
  color:var(--ink); overflow:hidden;
  font:16px/1.5 "Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,select{-webkit-tap-highlight-color:transparent}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%;min-height:0}

header{
  display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;
  padding:var(--header-pad);background:rgba(20,30,43,.92);
  border-bottom:1px solid var(--line);flex:none;backdrop-filter:blur(8px);
}
.brand{font-weight:700;font-size:14px;letter-spacing:.2px;white-space:nowrap;min-width:0}
.brand span{color:var(--faint);font-weight:400}
.pos{
  font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;
  color:var(--dim);background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;white-space:nowrap;
}
.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto}
.spacer{flex:1}
.ctl{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--dim);
  min-height:36px;transition:border-color .15s,color .15s,background .15s;
}
.ctl:hover{border-color:#3c5470;color:var(--ink)}
.ctl.on{border-color:var(--gold);color:var(--gold);background:rgba(240,180,41,.09)}
select.ctl{
  -webkit-appearance:none;appearance:none;padding-right:28px;max-width:min(220px,42vw);
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;
}
#jump{max-width:min(260px,48vw)}

/* mobile view tabs */
.view-tabs{
  display:none;flex:none;gap:6px;padding:8px 12px 0;background:transparent;
}
.view-tabs button{
  flex:1;min-height:var(--tap);border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--dim);font-size:14px;font-weight:600;
}
.view-tabs button.on{background:var(--panel2);color:var(--ink);border-color:#3c5470;box-shadow:inset 0 -2px 0 var(--gold)}

/* ---------- main ---------- */
main{
  flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
  gap:var(--main-gap);padding:var(--main-gap);min-height:0;
}

.pane{
  background:rgba(20,30,43,.88);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.pane-hd{
  display:flex;align-items:center;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--line);flex:none;font-size:12px;color:var(--dim);min-width:0;
}
.num{
  background:#0b64a8;color:#fff;font-weight:700;border-radius:6px;padding:2px 9px;font-size:13px;
  position:relative;flex:none;
}
.num.has-take::after{
  content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;
  background:var(--green);border:2px solid var(--panel);
}
.num.flagged{box-shadow:0 0 0 2px rgba(240,180,41,.45)}
.hd-title{font-weight:600;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;white-space:nowrap;flex:none}
.tag.cap{border-color:var(--gold);color:var(--gold)}
.tag.who-W{border-color:var(--navy);color:var(--navy)}
.tag.who-C{border-color:var(--gold);color:var(--gold)}
.tag.who-BOTH{border-color:var(--red);color:var(--red)}
.tag.who-NONE{border-color:var(--line);color:var(--faint)}
.meta{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}

/* slide image */
.slide-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0;
  background:linear-gradient(180deg,#0a1119,#0c1420);
}
.slide-wrap img{
  max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow);display:block;
  transition:opacity .22s ease,transform .22s ease;
}
.slide-wrap img.swap{opacity:0;transform:scale(.985)}

/* script */
.script{
  flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:smooth;
}
.run{display:grid;grid-template-columns:78px 1fr;gap:11px}
.who{font-size:11px;font-weight:700;letter-spacing:.09em;padding-top:3px;text-align:right}
.who.W{color:var(--navy)} .who.C{color:var(--gold)} .who.BOTH{color:var(--red)}
.lines{display:flex;flex-direction:column;gap:8px}
.lines p{font-size:clamp(15px,1.05vw + 12px,17px);line-height:1.55}
.do,.note,.cut{margin-left:89px;border-radius:8px;padding:8px 11px;font-size:13.5px;line-height:1.45}
.do{background:rgba(242,100,122,.11);border-left:3px solid var(--red);color:#ffb3c0;font-weight:600;font-style:italic}
.note{background:rgba(147,165,184,.09);border-left:3px solid var(--faint);color:var(--dim);font-style:italic}
.cut{background:rgba(240,180,41,.09);border-left:3px solid var(--gold);color:#e7c473;font-style:italic}
.cut b{font-style:normal;letter-spacing:.05em;font-size:11px}

/* ---------- record bar ---------- */
.recbar{
  flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px calc(10px + var(--safe-b));
  background:rgba(20,30,43,.96);border-top:1px solid var(--line);
  min-height:var(--recbar-h);
}
.nav{display:flex;gap:8px;flex:none}
.nav button{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  min-width:var(--tap);min-height:var(--tap);padding:0 14px;font-size:18px;color:var(--dim);
  transition:color .15s,border-color .15s,background .15s;
}
.nav button:hover{color:var(--ink);border-color:#3c5470}
.nav button:active{background:#223246}
.rec{
  display:inline-flex;align-items:center;gap:10px;background:#c0334c;color:#fff;font-weight:700;
  border-radius:11px;padding:0 20px;min-height:var(--tap);font-size:15px;
  box-shadow:0 4px 14px rgba(192,51,76,.35);transition:background .15s,transform .1s;
}
.rec:hover{background:#d43e58}
.rec:active{transform:scale(.98)}
.rec[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.rec.live{background:#8e2338;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.72}}
.dot{width:13px;height:13px;border-radius:50%;background:#fff;flex:none}
.rec.live .dot{border-radius:2px}
.rec .short{display:none}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--red);font-size:15px;min-width:52px}
.hint{font-size:12px;color:var(--faint);white-space:nowrap}
.hint kbd{
  display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
  padding:0 5px;font:11px/1.6 ui-monospace,Consolas,monospace;color:var(--dim);background:var(--panel2);
}
.take{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.take[hidden]{display:none}
[hidden]{display:none!important}
.take button{
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  min-height:40px;padding:8px 12px;font-size:13px;color:var(--dim);
}
.take button:hover{color:var(--ink);border-color:#3c5470}
.take .saved{color:var(--green);border-color:rgba(62,201,138,.4)}

/* camera pip */
.pip{
  position:fixed;right:max(12px,var(--safe-r));bottom:calc(var(--recbar-h) + 12px + var(--safe-b));
  width:min(210px,42vw);border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:#000;box-shadow:var(--shadow);z-index:40;
  resize:both;max-width:280px;max-height:40vh;
}
.pip.hidden{display:none}
.pip video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
.pip .pipbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel);font-size:11px;color:var(--dim)}
.pip .lvl{flex:1;height:4px;border-radius:3px;background:#22303f;overflow:hidden}
.pip .lvl i{display:block;height:100%;width:0;background:var(--green);transition:width .08s}
.pip .x{color:var(--faint);font-size:16px;line-height:1;padding:4px 6px;min-width:32px;min-height:32px}

/* playback overlay */
.modal{
  position:fixed;inset:0;background:rgba(6,10,16,.86);
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,var(--safe-t)) max(16px,var(--safe-r)) max(16px,var(--safe-b)) max(16px,var(--safe-l));
  z-index:60;
}
.modal.hidden{display:none}
.modal .box{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  max-width:min(760px,100%);width:100%;overflow:hidden;max-height:100%;
  display:flex;flex-direction:column;
}
.modal .box video{width:100%;display:block;background:#000;max-height:min(64vh,70dvh)}
.modal .mbar{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:13px;color:var(--dim);flex-wrap:wrap}

.bar{height:3px;background:#1b2836;flex:none}
.bar i{display:block;height:100%;background:var(--gold);transition:width .25s ease}

.empty{padding:24px;color:var(--faint);font-size:14px;text-align:center}
.err{
  margin:8px 14px 0;padding:9px 12px;border-radius:8px;background:rgba(242,100,122,.12);
  border:1px solid rgba(242,100,122,.35);color:#ffb3c0;font-size:13px;
}
.err.hidden{display:none}

/* ===== responsive ===== */

/* large desktops: give script a bit more room */
@media (min-width:1400px){
  main{grid-template-columns:minmax(0,1.25fr) minmax(380px,.9fr);gap:18px;padding:18px}
  .lines p{font-size:17.5px}
}

/* tablet / small laptop */
@media (max-width:1100px){
  main{grid-template-columns:minmax(0,1fr) minmax(280px,.95fr);gap:12px;padding:12px}
  select.ctl,#jump{max-width:min(200px,36vw)}
  .run{grid-template-columns:64px 1fr;gap:8px}
  .do,.note,.cut{margin-left:0}
}

/* stacked phone / narrow tablet: tabbed slide ↔ script */
@media (max-width:820px){
  :root{--header-pad:8px 12px;--main-gap:10px;--recbar-h:auto}
  header{gap:8px}
  .brand{font-size:13px;max-width:100%}
  .brand .full{display:none}
  .tools{width:100%;margin-left:0}
  .tools .ctl{flex:1 1 auto}
  select.ctl,#jump{max-width:none;flex:1 1 140px}
  .view-tabs{display:flex}
  main{
    grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);
    overflow:hidden;padding-top:8px;
  }
  main[data-mobile-view="slide"] .pane-script{display:none}
  main[data-mobile-view="script"] .pane-slide{display:none}
  .slide-wrap{padding:10px}
  .pane-hd .tag.act{display:none}
  .hint{display:none}
  .recbar{gap:8px;padding:10px 12px calc(10px + var(--safe-b))}
  .rec{flex:1 1 auto;justify-content:center;min-width:0}
  .rec .long{display:none}
  .rec .short{display:inline}
  .take{width:100%;order:5}
  .take button{flex:1}
  .pip{width:min(132px,36vw);bottom:calc(76px + var(--safe-b))}
  .pos{margin-left:auto}
}

/* very small phones */
@media (max-width:420px){
  .brand{letter-spacing:0}
  .tools .ctl{padding:7px 8px;font-size:12px}
  .nav button{min-width:40px;padding:0 10px}
  .rec{padding:0 14px;font-size:14px}
  .pane-hd{padding:8px 10px;gap:6px}
  .hd-title{font-size:12px}
  .run{grid-template-columns:56px 1fr}
  .who{font-size:10px}
}

/* short landscape phones: keep both panes side-by-side, compact chrome */
@media (max-height:500px) and (orientation:landscape){
  .view-tabs{display:none}
  main{
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);
    overflow:hidden;
  }
  main .pane-slide,main .pane-script{display:flex!important}
  header{padding:4px 10px}
  .brand .full{display:none}
  .tools{width:auto;margin-left:auto}
  .slide-wrap{padding:6px}
  .script{padding:8px;gap:8px}
  .recbar{padding:6px 10px;min-height:0}
  .pip{width:110px;bottom:58px}
  .lines p{font-size:14px}
}

@media (prefers-reduced-motion:reduce){
  .slide-wrap img,.rec,.ctl,.bar i{transition:none}
  .rec.live{animation:none}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">The House That AI Built <span class="full">· rehearsal</span></div>
    <span id="pos" class="pos" aria-live="polite">1 / 43</span>
    <div class="tools">
      <select id="filter" class="ctl" title="Filter deck" aria-label="Filter deck">
        <option value="all">All 43 slides</option>
        <option value="W">Will leads</option>
        <option value="C">Caroline leads</option>
        <option value="BOTH">Both / dialogue</option>
        <option value="capture">Capture slides</option>
        <option value="flagged">Flagged for review</option>
        <option value="unrecorded">Not yet recorded</option>
      </select>
      <button id="shuffle" class="ctl" title="Shuffle (S)" aria-pressed="false">Shuffle</button>
      <select id="jump" class="ctl" title="Jump to slide" aria-label="Jump to slide"></select>
      <button id="camBtn" class="ctl" title="Turn camera on" aria-pressed="false">Camera</button>
    </div>
  </header>

  <div id="err" class="err hidden" role="alert"></div>

  <div class="view-tabs" role="tablist" aria-label="Mobile view">
    <button type="button" role="tab" id="tabSlide" aria-selected="true" class="on">Slide</button>
    <button type="button" role="tab" id="tabScript" aria-selected="false">Script</button>
  </div>

  <main id="main" data-mobile-view="slide">
    <section class="pane pane-slide" aria-label="Slide">
      <div class="pane-hd">
        <span id="sNum" class="num">1</span>
        <span id="sTitle" class="hd-title">—</span>
        <span class="spacer"></span>
        <div class="meta">
          <span id="sCap" class="tag cap" hidden>CAPTURE</span>
          <span id="sAct" class="tag act">—</span>
        </div>
      </div>
      <div class="slide-wrap"><img id="sImg" alt=""></div>
    </section>

    <section class="pane pane-script" aria-label="Script">
      <div class="pane-hd">
        <span id="sWho" class="tag who-C">CAROLINE</span>
        <span id="sTime" class="tag">0:00</span>
        <span class="spacer"></span>
        <button id="flagBtn" class="ctl" style="padding:4px 9px;font-size:12px" title="Flag for review (F)">Flag</button>
      </div>
      <div id="script" class="script"></div>
    </section>
  </main>

  <div class="bar" aria-hidden="true"><i id="bar" style="width:2%"></i></div>

  <div class="recbar">
    <div class="nav">
      <button id="prev" title="Previous (←)" aria-label="Previous slide">←</button>
      <button id="next" title="Next (→)" aria-label="Next slide">→</button>
    </div>
    <button id="rec" class="rec" aria-label="Record this slide">
      <span class="dot" aria-hidden="true"></span>
      <span id="recTxt"><span class="long">Record this slide</span><span class="short">Record</span></span>
    </button>
    <span id="timer" class="timer" hidden>0:00</span>
    <div id="take" class="take" hidden>
      <button id="playBtn" class="saved">▶ Watch</button>
      <button id="dlBtn">Download</button>
      <button id="delBtn">Delete</button>
    </div>
    <span class="spacer"></span>
    <span class="hint"><kbd>Space</kbd> record · <kbd>←</kbd><kbd>→</kbd> move · <kbd>F</kbd> flag · <kbd>S</kbd> shuffle</span>
  </div>
</div>

<div id="pip" class="pip hidden">
  <video id="live" autoplay playsinline muted></video>
  <div class="pipbar">
    <span>mic</span><span class="lvl"><i id="lvl"></i></span>
    <button class="x" id="pipX" title="Hide camera" aria-label="Hide camera">✕</button>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Playback">
  <div class="box">
    <video id="playback" controls playsinline></video>
    <div class="mbar">
      <b id="mTitle">Take</b><span class="spacer"></span>
      <button id="mDl" class="ctl" style="padding:6px 11px">Download</button>
      <button id="mClose" class="ctl" style="padding:6px 11px">Close</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
